<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Define the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link the CSS file for styling -->
    <link rel="stylesheet" href="state-donor-declined.css">

    <!-- Title displayed in the browser tab -->
    <title>Donor Declined | Blood Relay</title>

</head>

<body>

    <!-- Main content of the page -->
    <main class="page">

        <!-- Container used to center and organize the content -->
        <div class="container flow-shell">

            <!-- Card containing the donor declined message -->
            <section class="card state-card">

                <!-- Icon showing the current state -->
                <div class="state-icon">
                    ↗
                </div>

                <!-- Small status label -->
                <span class="eyebrow">
                    Request still active
                </span>

                <!-- Main heading -->
                <h1 style="margin: 14px 0;">
                    Arjun cannot donate right now
                </h1>

                <!-- Explanation of what happens next -->
                <p class="muted">
                    That is okay. Your request remains active and
                    other nearby compatible volunteers are still
                    being contacted.
                </p>

                <!-- Buttons for the next actions -->
                <div class="edge-actions">

                    <!-- Button to view the request status -->
                    <a
                        class="btn btn-outline"
                        href="tracking.html"
                    >
                        Track request
                    </a>

                    <!-- Button to choose another donor -->
                    <a
                        class="btn btn-primary"
                        href="matches.html"
                    >
                        Choose next donor
                    </a>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
