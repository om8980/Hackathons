<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set the character encoding for the webpage -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on mobile, tablet, and desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Connect the CSS file that controls the page design -->
    <link rel="stylesheet" href="state-request-expired.css">

    <!-- Text displayed in the browser tab -->
    <title>Request Expired | Blood Relay</title>

</head>

<body>

    <!-- Main content of the webpage -->
    <main class="page">

        <!-- Container that keeps the content organized and centered -->
        <div class="container flow-shell">

            <!-- Card displaying the expired request information -->
            <section class="card state-card">

                <!-- Clock icon showing that the request has expired -->
                <div class="state-icon">
                    ◷
                </div>

                <!-- Small status label -->
                <span class="eyebrow">
                    Request expired
                </span>

                <!-- Main heading -->
                <h1 style="margin: 14px 0;">
                    This request is no longer active
                </h1>

                <!-- Explanation about why the request ended -->
                <p class="muted">
                    The response window for this request ended.
                    Start a new request in one tap if help is still needed.
                </p>

                <!-- Button to create a new emergency request -->
                <a
                    class="btn btn-primary flow-primary"
                    href="quick-request.html"
                >
                    Renew emergency request
                </a>

            </section>

        </div>

    </main>

</body>

</html>
