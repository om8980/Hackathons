<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="request-closed.css">

    <!-- Text shown in the browser tab -->
    <title>Request Closed | Blood Relay</title>
</head>

<body>

    <!-- Main content of the page -->
    <main class="page">

        <!-- Main container for the page content -->
        <div class="container flow-shell">

            <!-- Card showing that the blood request has been closed -->
            <section class="card state-card">

                <!-- Success checkmark icon -->
                <i class="success-icon">✓</i>

                <!-- Page heading -->
                <h1>Request closed</h1>

                <!-- Message explaining the status -->
                <p class="muted">
                    This request is resolved.
                    Nearby donors will no longer receive alerts for it.
                </p>

                <!-- Button to return to the home page -->
                <a class="btn btn-primary flow-primary" href="index.html">
                    Return home
                </a>

            </section>

        </div>

    </main>

</body>
</html>
