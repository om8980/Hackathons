<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Define the character encoding -->
    <meta charset="UTF-8">

    <!-- Make the webpage responsive on mobile, tablet, and desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Connect the CSS file used to style this page -->
    <link rel="stylesheet" href="state-no-donor.css">

    <!-- Title displayed in the browser tab -->
    <title>No Donor Nearby | Blood Relay</title>

</head>

<body>

    <!-- Main content of the webpage -->
    <main class="page">

        <!-- Container used to center the content -->
        <div class="container flow-shell">

            <!-- Card containing the no-donor message -->
            <section class="card state-card">

                <!-- Location/search icon -->
                <div class="state-icon">
                    ⌖
                </div>

                <!-- Small status label -->
                <span class="eyebrow">
                    Request still active
                </span>

                <!-- Main heading -->
                <h1 style="margin: 14px 0;">
                    No matching donor nearby yet
                </h1>

                <!-- Explanation about the donor search -->
                <p class="muted">
                    We are still looking for compatible volunteers
                    for CityCare Hospital.
                    You do not need to start again.
                </p>

                <!-- Action buttons -->
                <div class="edge-actions">

                    <!-- Button to check whether any donors have responded -->
                    <a
                        class="btn btn-outline"
                        href="matches.html"
                    >
                        Check responses
                    </a>

                    <!-- Button to increase the donor search area -->
                    <a
                        class="btn btn-primary"
                        href="tracking.html"
                    >
                        Widen search area
                    </a>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
